name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install deps
        run: npm install
      - name: Bump versionCode
        run: python3 -c "import json; f='app.json'; d=json.load(open(f)); d['expo']['android']['versionCode']=100+${{ github.run_number }}; json.dump(d, open(f,'w'), indent=2)"
      - name: Prebuild
        run: npx expo prebuild --platform android --clean
      - name: Fix Kotlin and Keystore
        run: |
          sed -i 's/1.9.24/1.9.25/g' android/build.gradle
          cat android/build.gradle | grep kotlinVersion
          if [ -f android/keystore/baku-release.keystore ]; then cp android/keystore/baku-release.keystore android/app/baku-release.keystore; fi
          if [ -f keystore/baku-release.keystore ]; then cp keystore/baku-release.keystore android/app/baku-release.keystore; fi
          if [ ! -f android/app/baku-release.keystore ]; then keytool -genkey -v -keystore android/app/baku-release.keystore -alias baku -keyalg RSA -keysize 2048 -validity 10000 -storepass baku1234 -keypass baku1234 -dname "CN=Baku, OU=Baku, O=Baku, L=Baku, S=Baku, C=AZ"; fi
          ls -lh android/app/*.keystore
          echo "android { signingConfigs { release { storeFile file('baku-release.keystore'); storePassword 'baku1234'; keyAlias 'baku'; keyPassword 'baku1234' } } buildTypes { release { signingConfig signingConfigs.release } } }" > android/app/signing.gradle
          grep -q signing.gradle android/app/build.gradle || echo "apply from: 'signing.gradle'" >> android/app/build.gradle
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: android/app/build/outputs/apk/release/*.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
